{% extends "base.html" %}

{% block title %}Tambah Artikel Baru - Admin Panel{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="../../static/css/admin_style.css">
{% endblock %}

{% block content %}
<div class="admin-container">
    <div class="form-container">
        <header class="form-header">
            <a href="/admin/dashboard" class="back-link">&larr; Kembali ke Dasbor</a>
            <h1 class="page-title">Tambah Artikel Baru</h1>
        </header>

        <form action="/admin/create" method="POST" class="admin-form">
            <div class="form-group">
                <label for="title">Judul Artikel</label>
                <input type="text" id="title" name="title" placeholder="Masukkan judul..." required>
            </div>

            <div class="form-group">
                <label for="created_at">Tanggal Publikasi</label>
                <input type="date" id="created_at" name="created_at" required>
            </div>

            <div class="form-group">
                <label for="content">Isi Artikel</label>
                <textarea id="content" name="content" rows="10" placeholder="Tuliskan isi artikel..." required></textarea>
            </div>

            <div class="action-buttons">
                <button type="submit" class="btn btn-primary">Terbitkan Artikel</button>
                <a href="/admin/dashboard" class="btn btn-secondary">Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
