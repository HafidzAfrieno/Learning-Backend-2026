{% extends "base.html" %}

{% block title %}Edit Artikel - Admin Panel{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/admin_style.css">
{% endblock %}

{% block content %}
<div class="admin-container">
    <div class="form-container">
        <header class="form-header">
            <a href="/admin/dashboard" class="back-link">&larr; Kembali ke Dasbor</a>
            <h1 class="page-title">Edit Artikel</h1>
        </header>

        <form action="/admin/edit/{{ article.id }}" method="POST" class="admin-form">
            <div class="form-group">
                <label for="title">Judul Artikel</label>
                <input type="text" id="title" name="title" value="{{ article.title }}" required>
            </div>

            <div class="form-group">
                <label for="content">Isi Artikel</label>
                <textarea id="content" name="content" rows="10" required>{{ article.content }}</textarea>
            </div>

            <div class="action-buttons">
                <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                <a href="/admin/dashboard" class="btn btn-secondary">Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
