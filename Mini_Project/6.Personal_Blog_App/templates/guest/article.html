{% extends "base.html" %}

{% block title %}{{ article.title }} - Blog Pribadi{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="../../static/css/guest_style.css">
{% endblock %}

{% block content %}
<div class="guest-container">
    <nav class="guest-nav">
        <a href="/" class="blog-brand">Blog Pribadi</a>
    </nav>

    <article>
        <h1 class="article-detail-title">{{ article.title }}</h1>
        <div class="article-meta">Dipublikasikan pada {{ article.created_at }}</div>
        <div class="article-detail-content">{{ article.content }}</div>
    </article>

    <a href="/" class="back-home">&larr; Kembali ke Halaman Utama</a>
</div>
{% endblock %}
