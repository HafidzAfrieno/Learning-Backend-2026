<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter</title>
  <link rel="stylesheet" href="../style/app_style.css">
</head>
<body>

  <div class="card">
    <h1>Unit Converter</h1>

    <!-- Navigasi Kategori (Menambahkan parameter 'event') -->
    <div class="nav-tabs">
      <span class="tab-item active" onclick="changeCategory('length', event)">Length</span>
      <span class="tab-item" onclick="changeCategory('weight', event)">Weight</span>
      <span class="tab-item" onclick="changeCategory('tempr', event)">Temperature</span>
    </div>

    <!-- TAMPILAN 1: FORM INPUT -->
    <div id="form-section">
      <div class="form-group">
        <label id="input-label" for="val-input">Enter value to convert</label>
        <input type="number" id="val-input" placeholder="Enter value..." value="20">
      </div>

      <div class="form-group">
        <label for="unit-from">Unit to Convert from</label>
        <select id="unit-from"></select>
      </div>

      <div class="form-group">
        <label for="unit-to">Unit to Convert to</label>
        <select id="unit-to"></select>
      </div>

      <button class="btn" onclick="handleConvert()">Convert</button>
    </div>

    <!-- TAMPILAN 2: HASIL KONVERSI -->
    <div id="result-section" class="hidden">
      <div class="result-label">Result of your calculation</div>
      <div class="result-value" id="result-text">-</div>
      <button class="btn" onclick="handleReset()">Reset</button>
    </div>
  </div>

  <script src="../style/app_script.js"></script>
</body>
</html>
